<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AXON">
  <!-- 사이트의 시각 서명을 그대로 쓴다 — 키워드 네트워크의 '점 + 후광'.
       16px 에서도 읽히도록 후광은 두 단계로만 두고, 축삭을 뜻하는 선은 굵게 남긴다. -->
  <defs>
    <radialGradient id="h" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b7dd8" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#3b7dd8" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#3b7dd8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#1a2b4c"/>
  <path d="M25 32h22" stroke="#e6eef9" stroke-width="5" stroke-linecap="round" opacity=".5"/>
  <circle cx="47" cy="32" r="5" fill="#e6eef9" opacity=".65"/>
  <circle cx="25" cy="32" r="18" fill="url(#h)"/>
  <circle cx="25" cy="32" r="7" fill="#fff"/>
</svg>
