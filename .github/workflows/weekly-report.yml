# 주간 리포트 본문(서술) 생성 — Claude 데스크톱 앱 없이 GitHub 안에서 돈다.
#
# 왜 옮겼나:
#   예전에는 데스크톱 앱의 예약 작업이 서술을 썼다. 앱이 닫혀 있으면 다음에 켤 때까지 밀린다.
#   Week 40 은 토요일 08:03 예정이었는데 앱이 주말 내내 닫혀 있어 화요일 09:58 에야 돌았다.
#
# 두 갈래 — 인증(LLM 토큰)이 있느냐에 따라
#   있다  Claude 가 해석 본문을 쓴다. 실패하면 취합본으로 대신한다(빈 화면은 내보내지 않는다).
#   없다  코드만으로 '자동 취합본'을 만든다(tools/digest-narrative.mjs). 같은 사건을 묶고 매체 수로
#         순위를 매길 뿐 해석·진단·권고는 없다. 화면에 그렇게 밝히고, 이슈로 알린다.
#   취합본은 임시다. 인증이 생기면 같은 서술 파일을 해석 본문으로 덮어쓴다(mode:'digest' 인 것이 교체 대상).
#
# 하는 일은 서술 파일을 쓰고, 검사하고, 그 파일만 커밋하는 것이다.
#   weeks.json 은 건드리지 않는다. 매시 수집도 그 파일을 고쳐 쓰므로 둘이 같이 커밋하면 push 가 엇갈린다.
#   서술을 본문에 붙이는 일(aggregate)은 daily.yml 의 '서술 있는 주차 집계' 단계가 한다.
#
# 인증: 저장소 시크릿 둘 중 하나(없어도 돈다 — 취합본이 나간다).
#   CLAUDE_CODE_OAUTH_TOKEN  Pro/Max 구독. 로컬에서 `claude setup-token` 으로 발급. 별도 API 요금 없음(구독 사용량에서 차감).
#   ANTHROPIC_API_KEY        API 종량제.

name: 주간 리포트 본문 생성

on:
  schedule:
    # 금요일에 주차가 닫힌다. 예약 실행은 제때 돈다는 보장이 없어(몇 시간 밀리거나 건너뛴다)
    # 세 번 걸어 둔다. 할 일이 없으면 Claude 를 부르기 전에 끝나므로 빈 실행은 비용이 없다.
    - cron: '0 23 * * 4'    # 금 08:00 KST
    - cron: '0 5 * * 5'     # 금 14:00 KST
    - cron: '0 23 * * 5'    # 토 08:00 KST
  workflow_dispatch:

permissions:
  contents: write           # 서술 파일 커밋
  actions: write            # 커밋 뒤 daily.yml 을 깨우기 위해
  issues: write             # 취합본이 나갔다는 알림

# 두 실행이 같은 주차를 동시에 쓰지 않게 줄을 세운다.
concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pnu-weekly
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # weeks.json 의 '진행 중' 깃발은 마지막 수집 실행 때의 값이라 늦을 수 있다.
      # 수집본과 오늘 날짜로 다시 계산해 둔다(작업 공간에서만 — 커밋하지 않는다).
      - name: 주차 상태 새로 계산
        run: node series.mjs > /dev/null

      - name: 할 일 찾기
        id: narr
        run: node tools/check-narrative.mjs

      # 인증이 없다고 실패하지 않는다 — 취합본을 만들면 된다.
      - name: 인증 확인
        id: auth
        env:
          HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_OAUTH" = "true" ] || [ "$HAS_KEY" = "true" ]; then
            echo "has_auth=true" >> "$GITHUB_OUTPUT"; echo "Claude 인증 있음 — 해석 본문을 쓴다"
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"; echo "Claude 인증 없음 — 자동 취합본을 만든다"
          fi

      # 누구를 어떻게 처리할지 한 곳에서 정한다.
      #   new     서술 파일이 아직 없는 주차(새로 만든다)
      #   upgrade 서술 파일이 취합본인 주차(인증이 있을 때만 해석 본문으로 교체한다)
      - name: 대상 정하기
        id: plan
        env:
          HAS_AUTH: ${{ steps.auth.outputs.has_auth }}
          NEW: ${{ steps.narr.outputs.need_write_ids }}
          UPGRADE: ${{ steps.narr.outputs.need_upgrade_ids }}
        run: |
          if [ "$HAS_AUTH" = "true" ]; then AI="$NEW $UPGRADE"; DIGEST=""; else AI=""; DIGEST="$NEW"; fi
          AI=$(echo $AI); DIGEST=$(echo $DIGEST); ALL=$(echo $AI $DIGEST)
          { echo "ai_ids=$AI"; echo "digest_ids=$DIGEST"; echo "all_ids=$ALL"; echo "new_ids=$(echo $NEW)"; } >> "$GITHUB_OUTPUT"
          echo "해석 본문: ${AI:-없음} · 자동 취합본: ${DIGEST:-없음}"

      # ── 인증 없음: 코드만으로 취합본
      - name: 자동 취합본 만들기
        if: steps.plan.outputs.digest_ids != ''
        run: |
          for id in ${{ steps.plan.outputs.digest_ids }}; do node tools/digest-narrative.mjs "$id"; done

      # ── 인증 있음: Claude 가 해석 본문을 쓴다. 실패해도 멈추지 않는다 — 아래 단계가 취합본으로 대신한다.
      - name: 서술 쓰기 (Claude)
        id: claude
        if: steps.plan.outputs.ai_ids != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # 쓰는 데 필요한 것만 연다. git·네트워크는 주지 않는다 — 커밋은 아래 단계가 결정적으로 한다.
          claude_args: >-
            --max-turns 80
            --allowedTools "Bash(node pnu-weekly/tools/week-brief.mjs:*),Bash(node pnu-weekly/tools/check-narrative-file.mjs:*),Read,Write,Edit,Glob,Grep"
          prompt: |
            AXON(대학 AX정책 AI 주간 모니터링)의 주간 리포트 서술을 쓴다. 명령은 저장소 최상위에서 아래 경로 그대로 실행한다.

            새로 쓸 주차: ${{ steps.narr.outputs.need_write_ids }}
            교체할 주차: ${{ steps.narr.outputs.need_upgrade_ids }}
            여러 개면 하나씩 처리한다. 이 목록에 없는 주차는 건드리지 않는다.

            '교체할 주차'의 서술 파일(pnu-weekly/data/narrative/<id>.json)은 코드가 만든 자동 취합본이다(mode 칸이 'digest').
            해석이 없는 임시 본문이므로 **같은 경로에 해석 본문을 새로 써서 덮어쓴다.** 새 파일에는 mode 칸을 넣지 않는다.
            취합본의 문장은 참고로 읽어도 되지만 그대로 옮기지 말고, 사건의 의미를 판단해서 쓴다.

            ## 1. 자료를 읽는다
            `node pnu-weekly/tools/week-brief.mjs <id>`
            브리프에 실린 기사 제목은 전부 실제 수집된 것이다. **여기 없는 사실은 쓰지 않는다.**
            전주 소제목이 함께 나오므로 이어지는 사안인지 새로 생긴 사안인지 구분해서 쓴다.

            ## 2. 서술 파일을 쓴다
            `pnu-weekly/data/narrative/<id>.json` 을 만든다.
            **형식은 같은 폴더에서 mode 칸이 없는 가장 최근 서술 파일(번호가 가장 큰 w*.json)을 먼저 읽고 그 구조를 그대로 따른다.**
            - `collected` 는 브리프가 알려 준 날짜를 적는다.
            - `summary` 는 4~6개 묶음. 각 문장의 `refKey` 는 브리프에 있는 **기사 제목의 부분 문자열**이어야 한다.
              그 기사를 유일하게 집어내는 짧은 조각을 고른다.
            - **숫자를 쓰지 않는다.** 수집 건수·위험신호 비율·Tier 등급·전주 대비 증감은 코드가 센다.
              기사에 적힌 사실(사업 금액·기간·대학 수)은 써도 된다.
            - 중요한 것을 앞에 둔다. 부산대와 직접 관련된 사안이 있으면 반드시 한 묶음으로 다룬다.
              전국 단위 정부 사업(AI중심대학·AX대학원 같은 것) 소식은 부산대가 해당되든 아니든 다룬다.
            - `<b>` 로 핵심 어구를 강조한다. 문장은 사실과 그것이 뜻하는 바를 함께 담는다.
            - `diagnosis.weak` 4개 내외, `diagnosis.rec` 4~5개. 권고는 실행 가능한 형태로.

            ## 3. 검사하고 고친다
            `node pnu-weekly/tools/check-narrative-file.mjs <id>` 가 통과할 때까지 고친다.
            refKey 가 안 걸리면 브리프에서 다른 조각을 고른다.
            **세 번 고쳐도 통과하지 못하면 멈춘다.** 억지로 통과시키지 않는다.

            ## 하지 말 것
            - 서술 파일 말고 다른 파일을 만들거나 고치지 않는다(aggregate·series·build 도 돌리지 않는다).
            - 브리프에 없는 사실을 쓰지 않는다. 검사를 우회하지 않는다.

      # Claude 가 통과했다고 해도 다시 잰다. 이 단계가 실제로 커밋을 허락하는 문지기다.
      # 통과하지 못한 것은 커밋하지 않고 되돌린다 — 빈 화면도, 깨진 서술도 내보내지 않는다.
      #   · 새 주차   → 깨진 파일을 지우고 취합본을 만든다
      #   · 교체 주차 → 깨진 파일을 버리고 이전(취합본) 파일로 되돌린다
      - name: 서술 검사 또는 되돌리기
        if: steps.plan.outputs.all_ids != ''
        run: |
          for id in ${{ steps.plan.outputs.all_ids }}; do
            f="data/narrative/$id.json"
            if test -f "$f" && node tools/check-narrative-file.mjs "$id"; then continue; fi
            echo "::warning::$id 서술이 검사를 통과하지 못해 되돌립니다"
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git checkout -- "$f"
            else
              rm -f "$f"; node tools/digest-narrative.mjs "$id"
            fi
            node tools/check-narrative-file.mjs "$id"        # 이것까지 실패하면 여기서 멈춘다
          done

      # 실제로 본문이 붙는지 미리 돌려 본다. 결과(weeks.json)는 커밋하지 않는다 — 붙이는 건 daily.yml 이 한다.
      - name: 집계 시험
        if: steps.plan.outputs.all_ids != ''
        run: |
          for id in ${{ steps.plan.outputs.all_ids }}; do node aggregate.mjs "$id" > /dev/null; done
          echo "집계 시험 통과"

      - name: 서술 파일만 커밋
        id: commit
        if: steps.plan.outputs.all_ids != ''
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --staged . 2>/dev/null || true
          for id in ${{ steps.plan.outputs.all_ids }}; do git add "pnu-weekly/data/narrative/$id.json"; done
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "새 서술 없음"; exit 0; fi
          KIND="주간 리포트 서술 생성 (weekly-report)"
          if [ -n "${{ steps.plan.outputs.digest_ids }}" ]; then KIND="주간 리포트 자동 취합본 생성 (weekly-report · Claude 인증 없음)"; fi
          git commit -q -m "${{ steps.plan.outputs.all_ids }} $KIND"
          # 작업 공간에 남은 weeks.json 등의 변경은 버린다 — 커밋한 것은 서술 파일뿐이다.
          git stash -q --include-untracked || true
          git pull --rebase -q origin main
          git push -q
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "푸시 완료"

      # GitHub 내장 토큰(GITHUB_TOKEN)으로 한 push 는 다른 워크플로를 깨우지 않는다(무한 연쇄 방지).
      # 그래서 daily.yml 의 push 트리거에 기대지 않고 직접 부른다. workflow_dispatch 는 예외로 허용된다.
      # daily.yml 이 '서술 있는 주차 집계' 단계에서 본문을 붙이고 배포까지 한다.
      - name: 본문 붙이기·배포 (daily.yml 호출)
        if: steps.commit.outputs.changed == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --ref main

      # 취합본이 나갔다는 사실은 알려야 한다 — 안 알리면 해석 본문이 나간 줄 안다.
      - name: 취합본 게시 알림
        if: steps.commit.outputs.changed == 'true' && steps.plan.outputs.digest_ids != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IDS: ${{ steps.plan.outputs.digest_ids }}
        run: |
          TITLE="주간 리포트 자동 취합본 게시됨 (해석 본문 아님)"
          BODY="${IDS} 주차는 Claude 인증이 없어 **자동 취합본**으로 게시했습니다.

          코드가 수집 기사에서 같은 사건을 묶고 매체 수로 순위를 매긴 것이며, 해석·진단·권고·전파경로는 없습니다.
          사이트의 해당 주차 맨 위에 그렇게 표시돼 있습니다.

          해석 본문으로 바꾸려면 둘 중 하나:
          - 저장소 시크릿 CLAUDE_CODE_OAUTH_TOKEN 등록(로컬에서 claude setup-token) 후 Actions → '주간 리포트 본문 생성' → Run workflow.
            취합본(mode: digest)은 해석 본문으로 덮어써지고, 실패하면 취합본이 그대로 남습니다.
          - 데스크톱 앱의 예약 작업(axon-weekly-report)이 돌면 같은 방식으로 교체합니다.

          해석 본문이 게시되면 다음 실행부터 이 이슈에 댓글이 달리지 않습니다. 이슈는 직접 닫아 주세요."
          NUM=$(gh issue list -R "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment -R "$REPO" "$NUM" --body "$BODY"
          else
            gh issue create -R "$REPO" --title "$TITLE" --body "$BODY"
          fi
