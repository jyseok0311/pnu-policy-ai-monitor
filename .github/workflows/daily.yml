# 매일 아침 기사·보도자료를 수집하고, 사이트를 새로 빌드해 GitHub Pages 에 올린다.
#
# 흐름:  collect → feeds → 검증 → series → daily/build/viz-lab → pdf → 데이터 커밋 → Pages 배포
#
# 설계 메모
# - dist/ 는 git 에 없다. 매번 여기서 새로 빌드해 Pages 아티팩트로 올린다.
#   PDF(약 50 MB)를 커밋하던 시절엔 커밋 23개 만에 .git 이 236 MB 가 됐다.
# - 커밋하는 것은 data/ 만이다(수집본·피드·weeks.json·thresholds.json). 텍스트라 작다.
# - 자동 커밋 메시지에 [skip ci] 를 붙여 이 워크플로가 자기 커밋에 다시 깨어나지 않게 한다.
# - push 로 깨어난 실행(코드 변경)은 수집을 건너뛴다. 코드를 고쳤다고 데이터가 바뀌면 안 된다.
# - 주간 리포트 '본문'은 만들지 않는다. 서술은 사람이 LLM 으로 쓰고 narrative/ 에 넣는 부분이다.
#   여기서는 수치·일일 브리핑·진행 중 주차의 신호만 갱신한다.

name: 매일 수집 · 빌드 · 배포

on:
  schedule:
    - cron: '0 22 * * *'          # 매일 07:00 KST (= 전날 22:00 UTC)
  workflow_dispatch:
    inputs:
      days:
        description: '수집 창(일). 하루치보다 넓게 잡아 늦게 색인된 기사를 건진다'
        default: '3'
        required: false
  push:
    branches: [main]

permissions:
  contents: write     # data/ 커밋
  pages: write        # Pages 배포
  id-token: write     # Pages 배포(OIDC)
  issues: write       # 실패 알림

# 배포는 한 번에 하나만. 스케줄과 push 가 겹쳐도 줄을 세운다.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pnu-weekly
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # 커밋 전 rebase 에 필요

      - uses: actions/setup-node@v4
        with:
          node-version: 22          # fetch · WebSocket 전역 · 최상위 await

      # PDF 렌더용. 한글·이모지 글리프는 웹폰트(Pretendard)가 대부분 덮지만,
      # 빠지는 글자(共起 같은 한자)까지 보장하려면 시스템 CJK 폰트가 있어야 한다.
      - name: 크롬 · CJK 폰트
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-color-emoji > /dev/null

      # ── 수집 (스케줄·수동 실행에서만)
      - name: 기사 수집
        if: github.event_name != 'push'
        run: node collect.mjs --week --days ${{ inputs.days || '3' }}

      - name: 기관 보도자료 수집
        if: github.event_name != 'push'
        continue-on-error: true     # 정부 사이트가 해외 IP 를 막을 수 있다. 실패는 파일 안에 기록된다.
        run: node feeds.mjs

      - name: 수집 결과 검증
        if: github.event_name != 'push'
        run: node tools/check-collect.mjs

      # ── 빌드
      - name: 시계열 · 임계값 · 진행 중 주차
        run: node series.mjs

      - name: HTML
        run: |
          node daily.mjs
          node build.mjs
          node viz-lab.mjs

      - name: PDF
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node pdf.mjs

      # ── 데이터 커밋 (수집한 실행에서만)
      - name: 수집 데이터 커밋
        if: github.event_name != 'push'
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnu-weekly/data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git commit -q -m "자동 수집 $(TZ=Asia/Seoul date +%Y-%m-%d) [skip ci]"
          git pull --rebase -q origin main
          git push -q

      # ── 사이트 구성 — 기존 URL(/pnu-weekly/dist/…)을 그대로 유지한다
      - name: 사이트 구성
        working-directory: .
        run: |
          mkdir -p site/pnu-weekly
          cp index.html .nojekyll site/
          cp -r pnu-weekly/dist site/pnu-weekly/dist
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── 실패 알림: 이슈를 하나만 열고, 이미 열려 있으면 거기에 댓글을 단다.
  alert:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: 이슈 열기 또는 댓글
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="자동 수집 실패"
          BODY="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST') 실행이 실패했습니다.

          실행 로그: ${RUN_URL}
          트리거: ${{ github.event_name }}

          흔한 원인
          - 구글 뉴스 RSS 가 비었거나 러너 IP 가 차단됨 → \`수집 결과 검증\` 단계 로그 확인
          - 정부 사이트 점검·개편 → \`기관 보도자료 수집\` 로그의 '실패' 행 확인, \`src/gov-sites.mjs\` 파서 점검
          - Pages 배포 오류 → 저장소 Settings → Pages → Source 가 'GitHub Actions' 인지 확인"
          NUM=$(gh issue list -R "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment -R "$REPO" "$NUM" --body "$BODY"
          else
            gh issue create -R "$REPO" --title "$TITLE" --body "$BODY"
          fi
